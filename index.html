<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>IRON LOG</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <main class="container">
    <header>
      <h1>IRON LOG</h1>
      <p class="subtitle">YOUR PERSONAL WORKOUT TRACKER</p>
    </header>

    <section id="homeScreen">
      <div class="card">
        <p class="label">TODAY'S WORKOUT</p>
        <h2>今日も鍛えよう！</h2>
        <p class="muted">トレーニングの記録を始めましょう。</p>
        <button class="primary-button" id="startButton">
          トレーニング開始
        </button>
      </div>

      <div class="card">
        <p class="label">TRAINING HISTORY</p>
        <h2 id="historyCount">0 回</h2>
        <p class="muted">保存したトレーニング回数</p>
      </div>
    </section>

    <section id="workoutScreen" hidden>
      <div class="card">
        <div class="section-heading">
          <div><p class="label workout-eyebrow">WORKOUT SESSION</p><h2>トレーニング記録</h2></div>
          <button class="small-button" id="backButton">戻る</button>
        </div>

        <label class="label" for="workoutDate">日付</label>
        <input type="date" id="workoutDate">

        <p id="workoutNotice" class="muted" role="status"></p>

        <div id="exerciseList"></div>

        <button class="secondary-button" id="addExerciseButton">
          ＋ 種目を追加
        </button>

        <button class="primary-button save-button" id="saveButton">
          トレーニングを保存
        </button>
      </div>
    </section>

    <section class="card">
      <p class="label">RECENT HISTORY</p>
      <h2>トレーニング履歴</h2>
      <div id="historyList">
        <p class="muted">まだ記録がありません。</p>
      </div>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
